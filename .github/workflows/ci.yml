name: Core and MAUI CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore core
        run: dotnet restore Hesabyar.Core.slnx
      - name: Build core
        run: dotnet build Hesabyar.Core.slnx --no-restore --configuration Release
      - name: Test core
        run: dotnet test Hesabyar.Core.slnx --no-build --configuration Release

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Android workload
        run: dotnet workload install maui-android
      - name: Restore Android
        run: dotnet restore src/Hesabyar.App/Hesabyar.App.csproj -p:MauiTargetFramework=net10.0-android
      - name: Build Android
        run: dotnet build src/Hesabyar.App/Hesabyar.App.csproj -p:MauiTargetFramework=net10.0-android --no-restore --configuration Release

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Windows MAUI workload
        run: dotnet workload install maui-windows
      - name: Restore Windows
        run: dotnet restore src/Hesabyar.App/Hesabyar.App.csproj -p:MauiTargetFramework=net10.0-windows10.0.19041.0 -r win-x64
      - name: Build Windows
        run: dotnet build src/Hesabyar.App/Hesabyar.App.csproj -p:MauiTargetFramework=net10.0-windows10.0.19041.0 -r win-x64 --no-restore --configuration Release
