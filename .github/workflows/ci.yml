name: Core CI
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Hesabyar.slnx
      - name: Build
        run: dotnet build Hesabyar.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test Hesabyar.slnx --no-build --configuration Release