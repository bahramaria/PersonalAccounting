name: Internal release packages

on:
  workflow_dispatch:
  push:
    branches:
      - feature/personal-accounting-mvp

permissions:
  contents: read

jobs:
  android-package:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[internal-release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Android workload
        run: dotnet workload install maui-android
      - name: Restore Android
        run: dotnet restore src/Hesabyar.App/Hesabyar.App.csproj -p:MauiTargetFramework=net10.0-android
      - name: Publish Android APK
        run: dotnet publish src/Hesabyar.App/Hesabyar.App.csproj -p:MauiTargetFramework=net10.0-android --no-restore --configuration Release -p:AndroidPackageFormat=apk
      - uses: actions/upload-artifact@v4
        with:
          name: Hesabyar-Android-APK
          path: src/Hesabyar.App/bin/Release/net10.0-android/**/*.apk
          if-no-files-found: error
          retention-days: 30

  windows-package:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[internal-release]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Windows MAUI workload
        run: dotnet workload install maui-windows --skip-manifest-update
      - name: Restore Windows
        run: dotnet restore src/Hesabyar.App/Hesabyar.App.csproj -p:MauiTargetFramework=net10.0-windows10.0.19041.0 -r win-x64
      - name: Publish unpackaged Windows app
        run: dotnet publish src/Hesabyar.App/Hesabyar.App.csproj -p:MauiTargetFramework=net10.0-windows10.0.19041.0 -r win-x64 --no-restore --configuration Release -p:WindowsPackageType=None
      - uses: actions/upload-artifact@v4
        with:
          name: Hesabyar-Windows-x64
          path: src/Hesabyar.App/bin/Release/net10.0-windows10.0.19041.0/win-x64/publish/**
          if-no-files-found: error
          retention-days: 30
